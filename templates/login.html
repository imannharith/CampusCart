<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusCart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <div class="logo" style="text-align: center; margin-bottom: 20px;">
                <a href="#" style="text-decoration: none; color: inherit; font-size: 32px; font-weight: bold;">Campus<span style="color: #2563eb;">Cart</span></a>
            </div>
            
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Please enter your details to sign in.</p>

            {% if error %}
            <p class="auth-error">{{ error }}</p>
            {% endif %}

            <!-- Form sedia untuk disambung oleh Backend Python -->
            <form action="/login" method="POST" class="auth-form">

                <div class="form-group">
                    <label for="email">Campus Email</label>
                    <input type="email" id="email" name="email" placeholder="student@campus.edu.my" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <label class="auth-checkbox">
                    <input type="checkbox" name="remember">
                    Remember me for 30 days
                </label>

                <button type="submit" class="btn-auth">Sign In</button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="/register">Sign Up Here</a>
            </p>
            <p class="auth-footer auth-admin-link">
                <a href="{{ url_for('admin_login') }}">Admin sign in →</a>
            </p>
        </div>
    </div>

</body>
</html>
