<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CampusCart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">
                <a href="{{ url_for('login') }}">Campus<span>Cart</span></a>
            </div>
            
            <h2>Create an Account</h2>
            <p class="auth-subtitle">Join CampusCart to buy and sell campus essentials.</p>

            {% if error %}
            <p class="auth-error">{{ error }}</p>
            {% endif %}

            <form action="/register" method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="John Doe" maxlength="80" value="{{ fullname or '' }}" required>
                </div>

                <div class="form-group">
                    <label for="email">Campus Email</label>
                    <input type="email" id="email" name="email" placeholder="student@campus.edu.my" maxlength="120" value="{{ email or '' }}" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" maxlength="128" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-auth">Register Account</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="/login">Sign In Here</a>
            </p>
        </div>
    </div>

</body>
</html>
